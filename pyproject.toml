[project]
name = "llm-redundancy-seminar"
version = "0.1.0"
description = "Project Seminar: Redundancy in Large Language Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "datasets>=2.19.0",
    "lm-eval>=0.4.2",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.4.2",
    "matplotlib>=3.8.4",
    "seaborn>=0.13.2",
    "accelerate>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redundancy"]
