[project]
name = "redunformer"
version = "0.1.0"
description = "Cross-granularity redundancy analysis for LLMs (SoSe 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "accelerate>=1.4.0",
    "datasets>=3.3.0",
    "lm-eval>=0.4.9",
    "matplotlib>=3.10.0",
    "numpy>=2.2.0",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.0",
    "scipy>=1.15.0",
    "seaborn>=0.13.2",
    "torch>=2.6.0",
    "transformers>=4.49.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redundancy"]
